# CI：python / frontend / rust / android 四 job。本地开发另有 scripts/check-all.ps1（口径对齐）。
# 真模型用例在 CI 自动跳过（缺模型/缺 sherpa 的 pytest skip 策略），跑的是纯逻辑与假缝。
# android job 只跑 JVM 单测（testDebugUnitTest）；androidTest 需要设备，不进 CI。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest soundfile websockets numpy
      - run: python -m pytest server/tests -q
      - run: python -m pytest listen/tests -q

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      # 假听译缝测试 spawn `python fake_listen.py`（依赖 websockets）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      # ws_connect 集成测试 spawn PATH 上的 python 跑 real_listen.py：
      # 顶部即 import listen.engine（numpy 等全套重依赖），装齐 requirements 才能到 READY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../engine/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # JVM 单测不需要真机；compileSdk 缺件由 AGP 自动下载（runner 的 SDK license 已预接受）
      - run: ./gradlew testDebugUnitTest --console=plain --no-daemon
